<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>햄스터 셰프</title>
    <link rel="stylesheet" href="./styles.css?v=pvp-defuse-minigame-20260518" />
  </head>
  <body>
    <main id="game-root">
      <canvas id="world"></canvas>

      <section id="start-screen" class="screen screen-visible" aria-label="시작 화면">
        <div class="brand-lockup">
          <p class="eyebrow">tiny bistro adventure</p>
          <h1>햄스터 셰프</h1>
          <section id="auth-panel" class="auth-panel" aria-label="계정">
            <div class="auth-header">
              <strong id="auth-status">계정 확인 중...</strong>
              <button id="logout-button" class="auth-logout hidden" type="button">로그아웃</button>
            </div>
            <div id="auth-banner" class="auth-banner hidden" role="status"></div>
            <div id="auth-form" class="auth-form">
              <label id="auth-nickname-field" class="auth-field hidden">
                <span>닉네임</span>
                <input id="auth-nickname" type="text" maxlength="16" placeholder="햄스터 셰프" />
              </label>
              <label class="auth-field">
                <span>이메일</span>
                <input id="auth-email" type="email" autocomplete="email" placeholder="chef@example.com" />
              </label>
              <label class="auth-field">
                <span>비밀번호</span>
                <input id="auth-password" type="password" autocomplete="current-password" placeholder="8자 이상" />
              </label>
              <div class="auth-actions">
                <button id="auth-submit-button" class="primary-action" type="button">로그인</button>
                <button id="auth-switch-button" class="primary-action secondary-action" type="button">회원가입하기</button>
              </div>
            </div>
          </section>
          <div id="start-actions" class="start-actions hidden">
            <div class="primary-modes">
              <button id="start-button" class="primary-action" type="button">챌린지 시작</button>
              <button id="multi-button" class="primary-action secondary-action" type="button">🐹 멀티 챌린지</button>
            </div>
            <div class="start-utility-actions">
              <button id="leaderboard-button" class="util-btn" type="button">챌린지 랭킹</button>
              <button id="tutorial-button" class="util-btn" type="button">튜토리얼</button>
              <button id="history-button" class="util-btn" type="button">영업 기록</button>
            </div>
            <button id="career-button" class="mode-coming-soon" type="button" disabled>성장 모드 — 준비 중</button>
          </div>
        </div>
      </section>

      <section id="hud" class="hud hidden" aria-label="게임 상태">
        <div class="hud-left">
          <div class="hud-title">햄스터 셰프</div>
          <div id="objective" class="objective">챌린지 모드 목표 레시피는 시작 시 정해집니다.</div>
        </div>
        <div class="hud-stats">
          <div class="stat"><span>코인</span><strong id="coin-count">0</strong></div>
          <div class="stat"><span>평판</span><strong id="reputation-count">0</strong></div>
          <div class="stat"><span>시간</span><strong id="timer">08:00</strong></div>
          <button id="map-button" class="icon-button hidden" type="button" title="지역 지도" aria-label="지역 지도">⌘</button>
          <button id="recipe-note-button" class="icon-button" type="button" title="레시피 노트" aria-label="레시피 노트">▤</button>
          <button id="sound-toggle" class="icon-button" type="button" title="소리 전환" aria-label="소리 전환">♪</button>
        </div>
      </section>

      <aside id="pvp-opponent-hud" class="pvp-opponent-hud hidden" aria-label="상대방 현황">
        <div class="pvp-opponent-label">🐹 <span id="pvp-opponent-name">상대방</span></div>
        <div class="pvp-opponent-stats">
          <span id="pvp-opponent-orders">0주문</span>
          <strong id="pvp-opponent-score">0점</strong>
        </div>
        <div id="pvp-debuff-notice" class="pvp-debuff-notice hidden"></div>
      </aside>

      <aside id="pvp-sabotage-panel" class="pvp-sabotage-panel hidden" aria-label="방해하기">
        <div class="pvp-sabotage-title">⚡ 방해하기</div>
        <button class="pvp-sabotage-btn" data-sabotage="trip" type="button">
          <span class="sab-label">넘어뜨리기 🌀</span>
          <span class="sab-cost">20💰</span>
        </button>
        <button class="pvp-sabotage-btn" data-sabotage="ink" type="button">
          <span class="sab-label">먹물 뿌리기 🖤</span>
          <span class="sab-cost">20💰</span>
        </button>
        <button class="pvp-sabotage-btn" data-sabotage="bomb" type="button">
          <span class="sab-label">폭탄 투척 💣</span>
          <span class="sab-cost">25💰</span>
        </button>
      </aside>

      <!-- PvP 이펙트 레이어 -->
      <div id="pvp-red-flash" class="pvp-red-flash hidden"></div>
      <div id="pvp-tilt-wrap" class="pvp-tilt-wrap">
        <div id="pvp-stars-overlay" class="pvp-stars-overlay hidden">💫 ⭐ 💫</div>
      </div>
      <div id="pvp-ink-overlay" class="pvp-ink-overlay hidden"></div>
      <div id="pvp-bomb-hud" class="pvp-bomb-hud hidden">
        <span>💣 폭탄 해제까지</span>
        <strong id="pvp-bomb-timer">30</strong>초
      </div>

      <!-- 폭탄 해제 미니게임 -->
      <div id="defuse-minigame" class="defuse-minigame hidden" aria-label="폭탄 해제">
        <p class="defuse-title">💣 폭탄 해제</p>
        <div class="defuse-hits">
          <div class="defuse-hit"></div>
          <div class="defuse-hit"></div>
          <div class="defuse-hit"></div>
        </div>
        <div class="defuse-track-wrap">
          <div class="defuse-track">
            <div class="defuse-zone" id="defuse-zone"></div>
            <div class="defuse-cursor" id="defuse-cursor"></div>
          </div>
        </div>
        <button id="defuse-action-btn" class="primary-action" type="button">해제 (E)</button>
      </div>

      <aside id="quest-tracker" class="quest-tracker hidden" aria-label="진행 중인 일">
        <span class="tracker-label">현재 일</span>
        <strong id="quest-title">없음</strong>
        <p id="quest-detail">게시판에서 일을 골라보세요.</p>
      </aside>

      <aside id="inventory-bar" class="inventory-bar hidden" aria-label="재료 가방"></aside>

      <aside id="tutorial-guide" class="tutorial-guide hidden" aria-live="polite" aria-label="튜토리얼 안내">
        <span id="tutorial-step-label">튜토리얼</span>
        <h2 id="tutorial-title">시작</h2>
        <p id="tutorial-copy">햄스터 셰프의 첫 영업을 따라 해보세요.</p>
        <button id="tutorial-exit" type="button">튜토리얼 종료</button>
      </aside>

      <div id="interaction-prompt" class="interaction-prompt hidden">
        <span id="interaction-name">상호작용</span>
        <button id="interaction-button" type="button">확인</button>
      </div>

      <section id="modal" class="modal hidden" aria-live="polite" aria-label="게임 메뉴">
        <div class="modal-panel">
          <button id="close-modal" class="close-button" type="button" title="닫기">×</button>
          <div id="modal-content"></div>
        </div>
      </section>

      <section id="result-screen" class="screen hidden" aria-label="결과 화면">
        <div class="result-lockup">
          <p id="result-kicker" class="eyebrow">service complete</p>
          <h2 id="result-title">결과</h2>
          <p id="result-copy"></p>
          <button id="restart-button" class="primary-action" type="button">다시 시작</button>
        </div>
      </section>

      <section id="challenge-leaderboard-screen" class="screen hidden" aria-label="챌린지 랭킹">
        <div class="challenge-lb-wrap">
          <p class="eyebrow">challenge complete</p>
          <h2 style="margin:0;font-size:clamp(48px,8vw,96px);line-height:0.95">챌린지 랭킹</h2>
          <div id="challenge-lb-summary" class="challenge-lb-run-summary"></div>
          <div id="challenge-lb-content"></div>
          <button id="challenge-lb-exit" class="primary-action secondary-action" type="button">시작 화면으로</button>
        </div>
      </section>

      <div id="toast" class="toast hidden" role="status"></div>
    </main>

    <script type="module" src="./src/main.js?v=pvp-defuse-minigame-20260518"></script>
  </body>
</html>
